# Activate with --spring.profiles.active=dev (or SPRING_PROFILES_ACTIVE=dev).
# Adds the repeatable development seed on top of the schema migrations.
spring.flyway.locations=classpath:db/migration,classpath:db/dev-migration

# Enable DEBUG and SQL parameter bind logging only in local development;
# jdbc.bind=TRACE logs bound parameters (including password/token hashes) and must stay out of prod.
logging.level.com.example.demo=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
spring.jpa.properties.hibernate.format_sql=true
