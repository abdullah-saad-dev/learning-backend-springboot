spring.application.name=demo1

# Serve framework-generated errors (e.g. validation 400s) as RFC 7807
# application/problem+json instead of Spring's older ad-hoc error body.
spring.mvc.problemdetails.enabled=true
springdoc.swagger-ui.path=/docs

# Health is the only endpoint web-exposed by default; details are hidden by
# default too. Showing them is useful locally but leaks internals in prod.
management.endpoints.web.exposure.include=health, info
management.info.env.enabled=true

app.jwt.accesstoken-validity-minutes=15
info.app.name=tasks api
info.app.version=1.0.1
info.app.description=A simple task manager
spring.jpa.hibernate.ddl-auto=validate

# Off, and Boot warns when it is not. Left on, the persistence context stays open for the whole
# request, so entities handed to the web layer are still managed and a stray setter would flush
# to the database. Transactions are TaskService's job; nothing outside it needs an open session.
spring.jpa.open-in-view=false

# Datasource credentials live in secrets.env at the project root (gitignored).
# The [.properties] hint tells Spring to parse that file with the properties
# loader despite the .env extension; "optional:" keeps startup working on
# machines where the file is absent. Imported values override the ones here.
spring.config.import=optional:file:./secrets.env[.properties]