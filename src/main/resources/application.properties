spring.application.name=demo1

# Serve framework-generated errors (e.g. validation 400s) as RFC 7807
# application/problem+json instead of Spring's older ad-hoc error body.
spring.mvc.problemdetails.enabled=true
springdoc.swagger-ui.path=/docs

# Health is the only endpoint web-exposed by default; details are hidden by
# default too. Showing them is useful locally but leaks internals in prod.
management.endpoints.web.exposure.include=health, info
management.info.env.enabled=true
info.app.name=tasks api
info.app.version=1.0.1
info.app.description=A simple task manager