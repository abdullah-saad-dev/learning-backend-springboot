spring.application.name=managable

# Serve framework-generated errors (e.g. validation 400s) as RFC 7807
# application/problem+json instead of Spring's older ad-hoc error body.
spring.mvc.problemdetails.enabled=true
springdoc.swagger-ui.path=/docs

# Health is the only endpoint web-exposed by default; details are hidden by
# default too. Showing them is useful locally but leaks internals in prod.
management.endpoints.web.exposure.include=health, info
management.info.env.enabled=true

info.app.name=Managable
info.app.version=1.0.1
info.app.description=Multi-tenant project and task manager
spring.jpa.hibernate.ddl-auto=validate

# Schema migrations only. The development seed (db/dev-migration) creates logins with a
# committed password hash and is added on top by application-dev.properties alone.
spring.flyway.locations=classpath:db/migration
# A database that was ever started with the dev profile has the seed in its history. Without
# this, starting it under any other profile fails validation on a "missing" repeatable.
spring.flyway.ignore-migration-patterns=*:future,repeatable:missing
app.jwt.ttl-minutes=15
app.refreshToken.ttl=7d
app.refreshToken.rotation-grace-seconds=30
app.refreshToken.absolute-expiration-days=30
app.otp.ttl=5m
app.mail.from=${APP_MAIL_FROM:no-reply@managable.local}

# SMTP settings for OTP email delivery
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Disable the mail health indicator unless explicitly enabled
management.health.mail.enabled=false

# Off, and Boot warns when it is not. Left on, the persistence context stays open for the whole
# request, so entities handed to the web layer are still managed and a stray setter would flush
# to the database. Transactions are TaskService's job; nothing outside it needs an open session.
spring.jpa.open-in-view=false

# Datasource credentials live in secrets.env at the project root (gitignored).
# The [.properties] hint tells Spring to parse that file with the properties
# loader despite the .env extension; "optional:" keeps startup working on
# machines where the file is absent. Imported values override the ones here.
spring.config.import=optional:file:./secrets.env[.properties]

logging.pattern.correlation=[%X{requestId:-}] 

# Prevent DevTools from hot-restarting mid-compile while javac is still writing target/classes
spring.devtools.restart.poll-interval=2s
spring.devtools.restart.quiet-period=1s

